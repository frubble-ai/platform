name: pr-template

# The title must be a conventional commit, since it becomes the squash
# commit message, and the body must fill every section of the template.
# `edited` is in the trigger so fixing either re-runs the check.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: pr template
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the title is a conventional commit
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # From the base branch, never the pull request: a pull request that edits
      # the template must not weaken what it is checked against.
      - name: Fetch the template from the base branch
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          curl -sSf -G --data-urlencode "ref=$BASE_REF" \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/.github/pull_request_template.md" \
            -o "$RUNNER_TEMP/pull_request_template.md"

      # No action does this: the ones that exist only check that a body is
      # non-empty or contains a string. Bots never fill a template, so only
      # their title is checked. The body arrives through env, never
      # interpolated into the script.
      - name: Check every section of the template is filled
        if: github.event.pull_request.user.type != 'Bot'
        env:
          TEMPLATE: ${{ runner.temp }}/pull_request_template.md
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: python
        run: |
          import os, re, sys

          strip = lambda s: re.sub(r"<!--.*?-->", "", s, flags=re.S)
          template = strip(open(os.environ["TEMPLATE"], encoding="utf-8").read())
          body = strip(os.environ.get("PR_BODY") or "")

          def sections(text):
              parts = re.split(r"^(## .+)$", text, flags=re.M)
              return {parts[i].strip(): parts[i + 1].strip() for i in range(1, len(parts), 2)}

          expected, given = sections(template), sections(body)
          item = re.compile(r"^\s*[-*] \[( |x|X)\] (.*\S)", re.M)
          na = re.compile(r"\b(n/a|not applicable)\b", re.I)

          problems = []
          for heading, content in expected.items():
              if heading not in given:
                  problems.append(f"section missing: {heading}")
                  continue
              if not given[heading]:
                  problems.append(f"section empty: {heading}")
                  continue
              # No checklist item may stay unticked unless marked n/a, and every
              # item of the template must be there, by its text. The template
              # ships them unticked, so a copied body must not pass on presence.
              lines = [(m.group(1), m.group(2).strip()) for m in item.finditer(given[heading])]
              for box, line in lines:
                  if box == " " and not na.search(line):
                      problems.append(f"checklist item not ticked or marked n/a: {line}")
              for m in item.finditer(content):
                  text = m.group(2).strip()
                  if not any(line.startswith(text) for _, line in lines):
                      problems.append(f"checklist item missing: {text}")

          for p in problems:
              print(f"::error::{p}")
          if problems:
              print("Fill every section of .github/pull_request_template.md, then edit the pull request.")
              sys.exit(1)
          print("The pull request follows the template.")
