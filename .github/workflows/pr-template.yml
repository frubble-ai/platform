name: pr-template

# A pull request whose body skips the template, or leaves a section empty,
# fails here. `edited` is in the trigger so fixing the body re-runs it.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  check:
    name: pr template
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Title and body arrive through env, never interpolated into the script.
      - name: Compare the body with the template
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: python
        run: |
          import os, re, sys

          template = open(".github/pull_request_template.md", encoding="utf-8").read()
          strip = lambda s: re.sub(r"<!--.*?-->", "", s, flags=re.S)
          body = strip(os.environ.get("PR_BODY") or "")
          title = os.environ.get("PR_TITLE") or ""

          parts = re.split(r"^(## .+)$", body, flags=re.M)
          sections = {parts[i].strip(): parts[i + 1].strip() for i in range(1, len(parts), 2)}

          problems = []
          if not re.match(r"^(feat|fix|chore|docs|refactor|ci)(\([^)]+\))?!?: \S", title):
              problems.append(f"title is not a conventional commit: {title!r}")
          for heading in re.findall(r"^## .+$", template, flags=re.M):
              if heading not in sections:
                  problems.append(f"section missing: {heading}")
              elif not sections[heading]:
                  problems.append(f"section empty: {heading}")

          for p in problems:
              print(f"::error::{p}")
          if problems:
              print("Fill every section of .github/pull_request_template.md, then edit the pull request.")
              sys.exit(1)
          print("The pull request follows the template.")
