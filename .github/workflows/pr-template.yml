name: pr-template

# The title must be a conventional commit, since it becomes the squash
# commit message, and the body must fill every section of the template.
# `edited` is in the trigger so fixing either re-runs the check.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: pr template
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check the title is a conventional commit
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # No action does this: the ones that exist only check that a body is
      # non-empty or contains a string. The body arrives through env, never
      # interpolated into the script.
      - name: Check every section of the template is filled
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: python
        run: |
          import os, re, sys

          template = open(".github/pull_request_template.md", encoding="utf-8").read()
          strip = lambda s: re.sub(r"<!--.*?-->", "", s, flags=re.S)
          body = strip(os.environ.get("PR_BODY") or "")

          parts = re.split(r"^(## .+)$", body, flags=re.M)
          sections = {parts[i].strip(): parts[i + 1].strip() for i in range(1, len(parts), 2)}

          problems = []
          for heading in re.findall(r"^## .+$", template, flags=re.M):
              if heading not in sections:
                  problems.append(f"section missing: {heading}")
              elif not sections[heading]:
                  problems.append(f"section empty: {heading}")

          for p in problems:
              print(f"::error::{p}")
          if problems:
              print("Fill every section of .github/pull_request_template.md, then edit the pull request.")
              sys.exit(1)
          print("The pull request follows the template.")
