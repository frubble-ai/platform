name: _cloudflare-live-plan

on:
  workflow_call:
    inputs:
      enabled:
        required: false
        type: boolean
        default: true
      stack:
        description: org, stg or prd — names the plan artifact and the state prefix.
        required: true
        type: string
      root:
        required: true
        type: string
      state_bucket:
        description: Management bucket. Cloudflare state is not environment workload state.
        required: true
        type: string
      workload_identity_provider:
        required: true
        type: string
      audience:
        required: true
        type: string
      certificate_dns_authorization_name:
        description: Name of the Certificate Manager authorization CNAME, from the GCP root's output. Empty for org, and until the first GCP apply.
        required: false
        type: string
        default: ""
      certificate_dns_authorization_target:
        required: false
        type: string
        default: ""
      origin_ip:
        description: Address of the load balancer, from the GCP root's output. Empty for org, and until the first GCP apply.
        required: false
        type: string
        default: ""
      mailgun_dkim_name:
        description: Name of the sending domain's DKIM record, from the mailgun root's output. Empty for org, and until the first mailgun apply.
        required: false
        type: string
        default: ""
      mailgun_dkim_value:
        required: false
        type: string
        default: ""
    secrets:
      CLOUDFLARE_PLAN_TOKEN:
        required: true

# No pull-requests: write — see _gcp-live-plan.yml. The aggregating job in
# live-plan.yml owns the comment.
permissions:
  contents: read
  id-token: write

env:
  TERRAFORM_VERSION: 1.16.6

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # This workflow, its caller and the shared scripts count as the stack:
      # a change to how the plan runs should be proven by a plan.
      - name: Does this PR touch the stack?
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.enabled }}" != "true" ]; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "plan disabled"
            exit 0
          fi
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")
          workflow='\.github/workflows/(_cloudflare-live-plan|live-plan)\.yml$'
          modules='terraform/modules/cloudflare/'
          if echo "$changed" | grep -qE "^(${{ inputs.root }}/|$modules|$workflow|\.github/scripts/terraform/)"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      # Deliberately not the minting token.
      #
      # This workflow runs on pull_request, and `uses: ./…` resolves the file
      # from the pull request's own branch. Anyone able to push a branch could
      # therefore rewrite these steps and send whatever secret the job holds to
      # a host of their choosing; masking only hides it from the log. A token
      # that can mint write tokens would hand full edge access to one
      # unreviewed pull request, which is exactly the split this pipeline
      # exists to enforce.
      #
      # So plans get a long-lived read-only token instead. It is still a
      # standing credential, but the worst a leak buys is reading DNS records
      # that are public anyway.
      - name: Use the read-only Cloudflare token
        if: steps.scope.outputs.relevant == 'true'
        shell: bash
        env:
          PLAN_TOKEN: ${{ secrets.CLOUDFLARE_PLAN_TOKEN }}
        run: |
          echo "::add-mask::$PLAN_TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$PLAN_TOKEN" >> "$GITHUB_ENV"

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        if: steps.scope.outputs.relevant == 'true'
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # No service account: the federated GitHub identity reads this stack's
      # state prefix directly (state_access.tf in org/gcp/_setup).
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        if: steps.scope.outputs.relevant == 'true'
        with:
          workload_identity_provider: ${{ inputs.workload_identity_provider }}
          audience: ${{ inputs.audience }}

      - name: Init
        if: steps.scope.outputs.relevant == 'true'
        working-directory: ${{ inputs.root }}
        run: terraform init -lockfile=readonly -backend-config="bucket=${{ inputs.state_bucket }}"

      # -lock=false: a plan writes no state, so it has no reason to take the
      # lock. See _gcp-live-plan.yml for the race that taking it caused.
      - name: Plan
        id: plan
        if: steps.scope.outputs.relevant == 'true'
        working-directory: ${{ inputs.root }}
        shell: bash
        env:
          PLAN_STORE_BUCKET: ${{ vars.PLAN_STORE_BUCKET }}
          TF_VAR_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
          TF_VAR_domain: ${{ vars.CLOUDFLARE_DOMAIN }}
          TF_VAR_certificate_dns_authorization_name: ${{ inputs.certificate_dns_authorization_name }}
          TF_VAR_certificate_dns_authorization_target: ${{ inputs.certificate_dns_authorization_target }}
          TF_VAR_origin_ip: ${{ inputs.origin_ip }}
          TF_VAR_mailgun_dkim_name: ${{ inputs.mailgun_dkim_name }}
          TF_VAR_mailgun_dkim_value: ${{ inputs.mailgun_dkim_value }}
        # Raw output to plan.txt only; summary.txt feeds the log and comment.
        run: |
          set -euo pipefail
          echo "::add-mask::$TF_VAR_account_id"
          echo "::add-mask::$TF_VAR_zone_id"
          "$GITHUB_WORKSPACE/.github/scripts/terraform/terraform-quiet.sh" plan.txt \
            plan -no-color -input=false -lock=false -out=tfplan
          "$GITHUB_WORKSPACE/.github/scripts/terraform/terraform-plan-summary.sh" tfplan \
            | tee summary.txt

      # Raw plan to the plan store (org/gcp/_setup/plan_store.tf), never an artifact.
      - name: Keep the full plan (private)
        if: always() && steps.scope.outputs.relevant == 'true'
        timeout-minutes: 10
        continue-on-error: true
        working-directory: ${{ inputs.root }}
        shell: bash
        env:
          PLAN_STORE_BUCKET: ${{ vars.PLAN_STORE_BUCKET }}
          PLAN_STORE_REF: >-
            ${{ github.event.pull_request.number
            && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
          PLAN_STORE_PREFIX_FILE: prefix.txt
        run: |
          if ! "$GITHUB_WORKSPACE/.github/scripts/terraform/plan-store-upload.sh" \
            plan cloudflare-${{ inputs.stack }} tfplan plan.txt; then
            echo "::warning::Private plan upload failed."
          fi

      # Named after the stack so the aggregator can label it.
      - name: Upload the summary
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plan-cloudflare-${{ inputs.stack }}
          path: |
            ${{ inputs.root }}/summary.txt
            ${{ inputs.root }}/prefix.txt
          retention-days: 5
          if-no-files-found: error
