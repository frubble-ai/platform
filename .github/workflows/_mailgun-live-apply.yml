name: _mailgun-live-apply

on:
  workflow_call:
    inputs:
      stack:
        required: true
        type: string
      gh_environment:
        description: GitHub environment the job runs in. The state binding for this stack trusts this exact name.
        required: true
        type: string
      root:
        required: true
        type: string
      state_bucket:
        required: true
        type: string
      workload_identity_provider:
        required: true
        type: string
      audience:
        required: true
        type: string
      # For a root that writes into its environment's project, as dev/mailgun
      # and stg/mailgun do with their sending keys (docs/email.md). prd/mailgun
      # declares no project_id, and OpenTofu ignores a TF_VAR_ for a variable
      # a root does not declare.
      project_id:
        required: false
        type: string
        default: ''
    secrets:
      # An environment secret. A job that declares an environment reads that
      # environment's value, so the caller has nothing to pass; the
      # declaration only names it.
      MAILGUN_APPLY_API_KEY:
        required: true

permissions:
  contents: read
  id-token: write

env:
  TOFU_VERSION: 1.13.2

jobs:
  apply:
    name: apply
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.gh_environment }}
      deployment: false

    concurrency:
      group: apply-mailgun-${{ inputs.stack }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No minting: Mailgun has no API to issue a key per run. The apply key
      # lives only in the environment, so pull-request code never reaches it.
      - name: Use the Mailgun apply key
        shell: bash
        env:
          APPLY_KEY: ${{ secrets.MAILGUN_APPLY_API_KEY }}
        run: |
          echo "::add-mask::$APPLY_KEY"
          echo "MAILGUN_API_KEY=$APPLY_KEY" >> "$GITHUB_ENV"

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      # No service account: the federated GitHub identity reads this stack's
      # state prefix directly (state_access.tf in org/gcp/_setup).
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ inputs.workload_identity_provider }}
          audience: ${{ inputs.audience }}

      - name: Init
        working-directory: ${{ inputs.root }}
        run: tofu init -lockfile=readonly -backend-config="bucket=${{ inputs.state_bucket }}"

      # Re-plan against current state and apply that saved plan. Raw output
      # to files only.
      - name: Apply
        working-directory: ${{ inputs.root }}
        shell: bash
        env:
          PLAN_STORE_BUCKET: ${{ vars.PLAN_STORE_BUCKET }}
          # Where the root writes its handoff for the Cloudflare root.
          TF_VAR_management_state_bucket: ${{ inputs.state_bucket }}
          TF_VAR_project_id: ${{ inputs.project_id }}
        run: |
          set -euo pipefail
          scripts="$GITHUB_WORKSPACE/.github/scripts/terraform"
          "$scripts/tofu-quiet.sh" plan.txt \
            plan -no-color -input=false -lock-timeout=5m -out=tfplan
          "$scripts/tofu-plan-summary.sh" tfplan
          "$scripts/tofu-quiet.sh" apply.txt \
            apply -no-color -input=false -lock-timeout=5m tfplan
          grep -E '^Apply complete!' apply.txt | "$scripts/redact.sh"

      # Raw output to the plan store.
      - name: Keep the full output (private)
        if: always()
        timeout-minutes: 10
        working-directory: ${{ inputs.root }}
        shell: bash
        env:
          PLAN_STORE_BUCKET: ${{ vars.PLAN_STORE_BUCKET }}
          PLAN_STORE_REF: ${{ github.ref_name }}
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/terraform/plan-store-upload.sh" \
            apply mailgun-${{ inputs.stack }} tfplan plan.txt apply.txt
