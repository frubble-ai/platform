name: _posthog-live-apply

on:
  workflow_call:
    inputs:
      stack:
        required: true
        type: string
      gh_environment:
        description: GitHub environment the job runs in. The state binding for this stack trusts this exact name.
        required: true
        type: string
      root:
        required: true
        type: string
      state_bucket:
        required: true
        type: string
      workload_identity_provider:
        required: true
        type: string
      audience:
        required: true
        type: string
    secrets:
      # An environment secret on posthog-org. A job that declares an
      # environment reads that environment's value, so the caller has nothing
      # to pass; the declaration only names it.
      POSTHOG_APPLY_API_KEY:
        required: true
      # Secrets so the step env header masks them.
      POSTHOG_MEMBERS:
        required: true
      POSTHOG_OWNER_EMAIL:
        required: true

permissions:
  contents: read
  id-token: write

env:
  TERRAFORM_VERSION: 1.16.6

jobs:
  apply:
    name: apply
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.gh_environment }}
      deployment: false

    concurrency:
      group: apply-posthog-${{ inputs.stack }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # No minting: PostHog has no API to issue a key per run. The apply key
      # lives only in the posthog-org environment, so pull-request code never
      # reaches it.
      - name: Use the PostHog apply key
        shell: bash
        env:
          APPLY_KEY: ${{ secrets.POSTHOG_APPLY_API_KEY }}
        run: |
          echo "::add-mask::$APPLY_KEY"
          echo "POSTHOG_API_KEY=$APPLY_KEY" >> "$GITHUB_ENV"

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # No service account: the federated GitHub identity reads this stack's
      # state prefix directly (state_access.tf in org/gcp/_setup).
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ inputs.workload_identity_provider }}
          audience: ${{ inputs.audience }}

      - name: Init
        working-directory: ${{ inputs.root }}
        run: terraform init -lockfile=readonly -backend-config="bucket=${{ inputs.state_bucket }}"

      # Re-plan against current state and apply that saved plan. Raw output
      # to files only.
      - name: Apply
        working-directory: ${{ inputs.root }}
        shell: bash
        env:
          PLAN_STORE_BUCKET: ${{ vars.PLAN_STORE_BUCKET }}
          TF_VAR_organization_id: ${{ vars.POSTHOG_ORGANIZATION_ID }}
          TF_VAR_members: ${{ secrets.POSTHOG_MEMBERS }}
          TF_VAR_owner_email: ${{ secrets.POSTHOG_OWNER_EMAIL }}
        run: |
          set -euo pipefail
          scripts="$GITHUB_WORKSPACE/.github/scripts"
          echo "::add-mask::$TF_VAR_organization_id"
          "$scripts/posthog-mask-members.sh"
          "$scripts/terraform-quiet.sh" plan.txt \
            plan -no-color -input=false -lock-timeout=5m -out=tfplan
          "$scripts/terraform-plan-summary.sh" tfplan
          "$scripts/terraform-quiet.sh" apply.txt \
            apply -no-color -input=false -lock-timeout=5m tfplan
          grep -E '^Apply complete!' apply.txt | "$scripts/redact.sh"

      # Raw output to the plan store.
      - name: Keep the full output (private)
        if: always()
        working-directory: ${{ inputs.root }}
        shell: bash
        env:
          PLAN_STORE_BUCKET: ${{ vars.PLAN_STORE_BUCKET }}
          PLAN_STORE_REF: ${{ github.ref_name }}
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/plan-store-upload.sh" \
            apply posthog-${{ inputs.stack }} tfplan plan.txt apply.txt
