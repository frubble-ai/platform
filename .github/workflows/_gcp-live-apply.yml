name: _gcp-live-apply

on:
  workflow_call:
    inputs:
      environment:
        description: Stack environment, used for labels and tfvars.
        required: true
        type: string
      gh_environment:
        description: GitHub environment the job runs in. The apply hub trusts this exact name.
        required: true
        type: string
      root:
        required: true
        type: string
      project_id:
        required: true
        type: string
      state_bucket:
        required: true
        type: string
      management_state_bucket:
        required: true
        type: string
      spoke_service_account:
        description: Spoke the hub becomes. The hub itself holds no permissions.
        required: true
        type: string
      service_account:
        required: true
        type: string
      workload_identity_provider:
        required: true
        type: string
      audience:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  TERRAFORM_VERSION: 1.16.6

jobs:
  # A push that touches a _setup root starts setup-cd beside the caller, and
  # setup-cd then waits in the `setup` environment for a reviewer. The apply
  # below reads _setup outputs through remote state, so applying against the
  # old _setup state would miss a new output or use a stale one. This waits
  # for setup-cd's run on this same commit, when the push called for one, and
  # fails if it did not succeed. Here rather than in each caller so stg and
  # prd cannot drift apart. If the reviewer takes longer than the timeout,
  # this fails and the caller is re-run by hand once setup-cd has succeeded.
  setup-first:
    name: wait for setup-cd
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # Decided from the push where it can be: the other run may register
      # after this job starts, and silence must not read as "not triggered".
      # When the previous commit is not in the clone, as after a force-push,
      # or there is none, as on a dispatch, the answer comes from the poll
      # instead. The path list mirrors setup-cd.yml's.
      - name: Wait for setup-cd on this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          paths='^(terraform/live/[^/]+/gcp/_setup/|terraform/modules/gcp/(developer-access|plan-store|project|project-pin|state-bucket|wif-hub|wif-spoke)/|\.github/workflows/(_setup-apply|setup-cd)\.yml$|\.github/scripts/terraform/)'
          expected=unknown
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # Captured first: in a pipeline, grep -q stopping at its first
            # match can hand git diff a SIGPIPE, which would read as no match.
            changed=$(git diff --name-only "$BEFORE" "$SHA")
            if grep -qE "$paths" <<<"$changed"; then
              expected=yes
              echo "this push touched a _setup path; setup-cd must run for $SHA"
            else
              echo "this push touched no _setup path; nothing to wait for"
              exit 0
            fi
          else
            echo "no previous commit to diff against; checking for a setup-cd run"
          fi
          latest() {
            gh api "repos/$REPO/actions/workflows/setup-cd.yml/runs?head_sha=$SHA&per_page=1" \
              --jq '.workflow_runs[0] // empty | "\(.status) \(.conclusion // "-") \(.html_url)"'
          }
          run=""
          for _ in $(seq 1 30); do
            run=$(latest)
            [ -n "$run" ] && break
            sleep 10
          done
          if [ -z "$run" ]; then
            if [ "$expected" = yes ]; then
              echo "::error::a _setup path changed but no setup-cd run exists for $SHA after five minutes"
              exit 1
            fi
            echo "no setup-cd run for $SHA; nothing to wait for"
            exit 0
          fi
          while :; do
            read -r status conclusion url <<<"$run"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "setup-cd succeeded: $url"
                exit 0
              fi
              echo "::error::setup-cd did not succeed ($conclusion): $url. Re-run this workflow once it has."
              exit 1
            fi
            echo "setup-cd is $status, waiting: $url"
            sleep 30
            run=$(latest)
          done

  apply:
    name: apply
    needs: setup-first
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.gh_environment }}
      # The environment is used for its secrets, its protection rules and as
      # the claim the apply hub trusts — not to record a release. Left true,
      # every merge would file a deployment for infrastructure that may not
      # have changed at all.
      deployment: false

    # One apply per environment, and never interrupted. A cancelled apply
    # leaves the state lock held and the infrastructure half-changed, which
    # costs more to recover from than waiting costs to avoid.
    concurrency:
      group: apply-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ inputs.workload_identity_provider }}
          service_account: ${{ inputs.service_account }}
          audience: ${{ inputs.audience }}

      - name: Init
        working-directory: ${{ inputs.root }}
        run: |
          terraform init -lockfile=readonly \
            -backend-config="bucket=${{ inputs.state_bucket }}" \
            -backend-config="impersonate_service_account=${{ inputs.spoke_service_account }}"

      # Re-plan against current state and apply that saved plan. Raw output
      # to files only.
      - name: Apply
        working-directory: ${{ inputs.root }}
        shell: bash
        env:
          PLAN_STORE_BUCKET: ${{ vars.PLAN_STORE_BUCKET }}
          TF_VAR_project_id: ${{ inputs.project_id }}
          TF_VAR_management_state_bucket: ${{ inputs.management_state_bucket }}
          TF_VAR_spoke_service_account: ${{ inputs.spoke_service_account }}
        run: |
          set -euo pipefail
          scripts="$GITHUB_WORKSPACE/.github/scripts/terraform"
          "$scripts/terraform-quiet.sh" plan.txt \
            plan -no-color -input=false -lock-timeout=5m -out=tfplan
          "$scripts/terraform-plan-summary.sh" tfplan
          "$scripts/terraform-quiet.sh" apply.txt \
            apply -no-color -input=false -lock-timeout=5m tfplan
          grep -E '^Apply complete!' apply.txt | "$scripts/redact.sh"

      # Raw output to the plan store.
      - name: Keep the full output (private)
        if: always()
        timeout-minutes: 10
        working-directory: ${{ inputs.root }}
        shell: bash
        env:
          PLAN_STORE_BUCKET: ${{ vars.PLAN_STORE_BUCKET }}
          PLAN_STORE_REF: ${{ github.ref_name }}
          PLAN_STORE_AS: ${{ inputs.spoke_service_account }}
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/terraform/plan-store-upload.sh" \
            apply gcp-${{ inputs.environment }} tfplan plan.txt apply.txt
