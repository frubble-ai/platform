name: _gcp-live-apply

on:
  workflow_call:
    inputs:
      environment:
        description: Stack environment, used for labels and tfvars.
        required: true
        type: string
      gh_environment:
        description: GitHub environment the job runs in. The apply hub trusts this exact name.
        required: true
        type: string
      root:
        required: true
        type: string
      project_id:
        required: true
        type: string
      state_bucket:
        required: true
        type: string
      management_state_bucket:
        required: true
        type: string
      spoke_service_account:
        description: Spoke the hub becomes. The hub itself holds no permissions.
        required: true
        type: string
      service_account:
        required: true
        type: string
      workload_identity_provider:
        required: true
        type: string
      audience:
        required: true
        type: string
      composio_auth_config_ids:
        description: The API's Composio auth configs, `provider=id` pairs separated by commas.
        required: false
        type: string
        default: ""
      osiris_auth_config_ids:
        description: The API's osiris auth configs, `provider=id` pairs separated by commas.
        required: false
        type: string
        default: ""
      stack_switch:
        description: >-
          Raw value of the stack's on/off repository variable (STG_ENABLED), passed through
          untouched. The run step sets TF_VAR_enabled from it: only the exact, lowercase
          `false` is off; empty or anything else is on. Only stg's roots declare `enabled`
          (docs/stg-switch.md); a root that does not ignores it.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

env:
  TOFU_VERSION: 1.13.2

jobs:
  # A push that touches a _setup root starts setup-cd beside the caller, and
  # setup-cd then waits in the `setup` environment for a reviewer. The apply
  # below reads _setup outputs through remote state, so applying against the
  # old _setup state would miss a new output or use a stale one. This waits
  # for setup-cd's run on this same commit, when the push called for one, and
  # fails if it did not succeed (scripts/workflows/wait-for-workflow.sh).
  # Here rather than in each caller so stg and prd cannot drift apart. If the
  # reviewer takes longer than the timeout, this fails and the caller is
  # re-run by hand once setup-cd has succeeded.
  setup-first:
    name: wait for setup-cd
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # PATHS mirrors setup-cd.yml's triggers; change both.
      - name: Wait for setup-cd on this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          BRANCH: ${{ github.ref_name }}
          WORKFLOW: setup-cd.yml
          PATHS: '^(terraform/live/[^/]+/gcp/_setup/|terraform/modules/gcp/(developer-access|plan-store|project|project-pin|state-bucket|wif-hub|wif-spoke)/|\.github/workflows/(_setup-apply|setup-cd)\.yml$|\.github/scripts/terraform/)'
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/workflows/wait-for-workflow.sh"

  apply:
    name: apply
    needs: setup-first
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.gh_environment }}
      # The environment is used for its secrets, its protection rules and as
      # the claim the apply hub trusts — not to record a release. Left true,
      # every merge would file a deployment for infrastructure that may not
      # have changed at all.
      deployment: false

    # One apply per environment, and never interrupted. A cancelled apply
    # leaves the state lock held and the infrastructure half-changed, which
    # costs more to recover from than waiting costs to avoid.
    concurrency:
      group: apply-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ inputs.workload_identity_provider }}
          service_account: ${{ inputs.service_account }}
          audience: ${{ inputs.audience }}

      - name: Init
        working-directory: ${{ inputs.root }}
        run: |
          tofu init -lockfile=readonly \
            -backend-config="bucket=${{ inputs.state_bucket }}" \
            -backend-config="impersonate_service_account=${{ inputs.spoke_service_account }}"

      # Re-plan against current state and apply that saved plan. Raw output
      # to files only.
      - name: Apply
        working-directory: ${{ inputs.root }}
        shell: bash
        env:
          PLAN_STORE_BUCKET: ${{ vars.PLAN_STORE_BUCKET }}
          STACK_SWITCH: ${{ inputs.stack_switch }}
          STG_ENABLED_NOW: ${{ vars.STG_ENABLED }}
          TF_VAR_project_id: ${{ inputs.project_id }}
          TF_VAR_management_state_bucket: ${{ inputs.management_state_bucket }}
          TF_VAR_spoke_service_account: ${{ inputs.spoke_service_account }}
          TF_VAR_composio_auth_config_ids: ${{ inputs.composio_auth_config_ids }}
          TF_VAR_osiris_auth_config_ids: ${{ inputs.osiris_auth_config_ids }}
        run: |
          # Resolved here, case-sensitively, not in an expression: Actions
          # compares strings case-insensitively, so `!= 'false'` there would
          # read FALSE as off (docs/stg-switch.md).
          if [ "$STACK_SWITCH" = "false" ]; then export TF_VAR_enabled=false; else export TF_VAR_enabled=true; fi
          echo "enabled: $TF_VAR_enabled"
          # A re-run reuses this run's switch value, but STG_ENABLED may have
          # changed since: refuse rather than apply the old direction. Only
          # stg's callers pass stack_switch (docs/stg-switch.md).
          if [ -n "$STACK_SWITCH" ]; then
            now=$([ "$STG_ENABLED_NOW" = "false" ] && echo false || echo true)
            if [ "$now" != "$TF_VAR_enabled" ]; then
              echo "::error::STG_ENABLED now reads stg as $now, but this run was started for $TF_VAR_enabled. Start a new stg-cd run."
              exit 1
            fi
          fi
          set -euo pipefail
          scripts="$GITHUB_WORKSPACE/.github/scripts/terraform"
          "$scripts/tofu-quiet.sh" plan.txt \
            plan -no-color -input=false -lock-timeout=5m -out=tfplan
          "$scripts/tofu-plan-summary.sh" tfplan
          "$scripts/tofu-quiet.sh" apply.txt \
            apply -no-color -input=false -lock-timeout=5m tfplan
          grep -E '^Apply complete!' apply.txt | "$scripts/redact.sh"

      # Raw output to the plan store.
      - name: Keep the full output (private)
        if: always()
        timeout-minutes: 10
        working-directory: ${{ inputs.root }}
        shell: bash
        env:
          PLAN_STORE_BUCKET: ${{ vars.PLAN_STORE_BUCKET }}
          PLAN_STORE_REF: ${{ github.ref_name }}
          PLAN_STORE_AS: ${{ inputs.spoke_service_account }}
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/terraform/plan-store-upload.sh" \
            apply gcp-${{ inputs.environment }} tfplan plan.txt apply.txt
